<style>
.mdt-module{color:var(--text-primary,#e5e7eb);padding:22px;max-width:1180px;margin:0 auto}.mdt-module h2{margin:0 0 6px;font-size:22px}.mdt-module .sub{color:var(--text-secondary,#9ca3af);margin-bottom:18px}.mdt-module .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.mdt-module input,.mdt-module textarea,.mdt-module select{background:var(--input-bg,rgba(15,23,42,.8));color:inherit;border:1px solid var(--border-color,rgba(148,163,184,.3));border-radius:8px;padding:10px;font:inherit;min-width:0}.mdt-module input{flex:1;min-width:200px}.mdt-module button{background:var(--accent-color,#b98b42);color:#111827;border:0;border-radius:8px;padding:10px 14px;font-weight:650;cursor:pointer}.mdt-module button.secondary{background:rgba(148,163,184,.16);color:inherit;border:1px solid rgba(148,163,184,.25)}.mdt-module button.danger{background:#7f1d1d;color:white}.mdt-module .form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;padding:14px;border:1px solid rgba(148,163,184,.22);border-radius:12px}.mdt-module .form textarea{grid-column:1/-1;min-height:90px}.mdt-module .form .actions{grid-column:1/-1;display:flex;gap:8px}.mdt-module .items{display:grid;gap:10px}.mdt-module .item{padding:14px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(148,163,184,.035)}.mdt-module .itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mdt-module .item h3{margin:0 0 5px;font-size:16px}.mdt-module .meta{font-size:12px;color:var(--text-secondary,#9ca3af);margin:6px 0}.mdt-module .desc{white-space:pre-wrap;overflow-wrap:anywhere}.mdt-module .actions{display:flex;gap:6px;flex-wrap:wrap}.mdt-module .empty{padding:22px;text-align:center;color:var(--text-secondary,#9ca3af);border:1px dashed rgba(148,163,184,.3);border-radius:12px}.mdt-module .message{margin:8px 0;color:var(--text-secondary,#9ca3af)}@media(max-width:650px){.mdt-module .form{grid-template-columns:1fr}.mdt-module .form textarea,.mdt-module .form .actions{grid-column:1}.mdt-module .itemhead{display:block}}
</style>
<section class="mdt-module" id="mdt-module-announcements">
 <h2>Bekanntmachungen</h2><div class="sub">Bekanntmachungen veröffentlichen und verwalten.</div>
 <div class="toolbar"><input id="announcements-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="announcements-reload">Aktualisieren</button><button id="announcements-new">+ Neuer Eintrag</button></div>
 <div class="message" id="announcements-message" role="status">Daten werden geladen …</div>
 <div class="form" id="announcements-form" style="display:none">
  <input id="announcements-title" placeholder="Titel / Ankündigung" maxlength="180">
  <select id="announcements-status"><option value="active">Active</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="announcements-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="announcements-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="announcements-save">Speichern</button><button class="secondary" id="announcements-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="announcements-items"></div>
</section>
<script>
(()=>{const key="announcements",readonly=false,root=document.getElementById('mdt-module-announcements');if(!root||root.dataset.ready)return;root.dataset.ready='1';let rows=[],editing=null;
 const el=id=>document.getElementById(key+'-'+id),msg=t=>el('message').textContent=t;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const call=(method,...args)=>new Promise((resolve,reject)=>{const r=CloudApi.run;r.withSuccessHandler(resolve).withFailureHandler(reject)[method](sessionStorage.getItem('fib_mdt_session')||'',...args)});
 function date(v){if(!v)return '';try{return new Date(v).toLocaleString()}catch{return String(v)}}
 function render(){const q=el('search').value.trim().toLowerCase();const filtered=rows.filter(r=>[r.title,r.description,r.status,r.created_by_name,r.detail,r.action].join(' ').toLowerCase().includes(q));el('items').innerHTML=filtered.length?filtered.map(r=>`<article class="item"><div class="itemhead"><div><h3>${esc(r.title||r.action||'Eintrag')} </h3><div class="meta">${esc(r.status||'')} · ${esc(date(r.eventDate||r.created_at))} · ${esc(r.created_by_name||r.actor_name||'')}</div></div>${readonly?'':`<div class="actions"><button class="secondary" data-edit="${esc(r.id)}">Bearbeiten</button><button class="danger" data-delete="${esc(r.id)}">Löschen</button></div>`}</div><div class="desc">${esc(r.description||r.detail||'Keine weitere Beschreibung.')}</div></article>`).join(''):'<div class="empty">Keine Einträge vorhanden.</div>';}
 async function load(){msg('Daten werden geladen …');try{rows=await call('getModuleItems',key);if(!Array.isArray(rows))rows=[];msg(`${rows.length} Einträge geladen.`);render()}catch(e){msg(e.message||'Die Daten konnten nicht geladen werden.');el('items').innerHTML='<div class="empty">Zugriff fehlgeschlagen. Bitte Berechtigungen und Supabase-Konfiguration prüfen.</div>';}}
 function open(row){editing=row?.id||null;el('form').style.display='grid';el('title').value=row?.title||'';el('description').value=row?.description||'';el('status').value=row?.status||"active";const d=row?.eventDate?new Date(row.eventDate):null;el('date').value=d&&!Number.isNaN(d.getTime())?new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16):'';el('title').focus()}
 function close(){el('form').style.display='none';editing=null}
 if(!readonly){el('new').addEventListener('click',()=>open());el('cancel').addEventListener('click',close);el('save').addEventListener('click',async()=>{const title=el('title').value.trim();if(!title){msg('Bitte einen Titel eingeben.');return}const data={title,description:el('description').value.trim(),status:el('status').value,eventDate:el('date').value?new Date(el('date').value).toISOString():null};el('save').disabled=true;try{if(editing)await call('updateModuleItem',key,editing,data);else await call('createModuleItem',key,data);close();msg('Gespeichert.');await load()}catch(e){msg(e.message||'Speichern fehlgeschlagen.')}finally{el('save').disabled=false}});el('items').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const row=rows.find(r=>String(r.id)===edit.dataset.edit);if(row)open(row)}if(del&&confirm('Diesen Eintrag wirklich löschen?')){try{await call('deleteModuleItem',key,del.dataset.delete);await load()}catch(err){msg(err.message||'Löschen fehlgeschlagen.')}}})}
 el('search').addEventListener('input',render);el('reload').addEventListener('click',load);load();
})();
</script>
