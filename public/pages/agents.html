<script>

(function() {

    "use strict";


    /* =====================================================
       STATE
    ====================================================== */

    const state =
        window.__FIB_MDT_AGENTS_PAGE__ ||
        {

            agents: [],

            filteredAgents: [],

            selectedAgent: null,

            rankOptions: [],

            trainings: [],

            notes: [],

            trainingsLoaded: false,

            notesLoaded: false,

            bundleLoaded: false,

            bundleLoading: false,

            modalTab: "personal",

            globalEventsBound: false

        };


    window.__FIB_MDT_AGENTS_PAGE__ =
        state;


    /* =====================================================
       TOKEN
    ====================================================== */

    function getAgentsSessionToken() {

        if (
            typeof sessionToken !==
            "undefined" &&
            sessionToken
        ) {

            return sessionToken;

        }


        try {

            return (
                sessionStorage.getItem(
                    "fib_mdt_session"
                ) ||
                sessionStorage.getItem(
                    "lspd_mdt_session"
                ) ||
                ""
            );

        } catch (error) {

            console.error(
                "FIB MDT – Session konnte nicht gelesen werden:",
                error
            );

            return "";

        }

    }


    /* =====================================================
       HELPERS
    ====================================================== */

    function $(
        id
    ) {

        return document.getElementById(
            id
        );

    }


    function escapeHtml(
        value
    ) {

        return String(
            value ??
            ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    function getValue(
        object,
        keys,
        fallback = ""
    ) {

        if (!object) {
            return fallback;
        }


        for (
            const key of keys
        ) {

            if (
                Object.prototype.hasOwnProperty.call(
                    object,
                    key
                ) &&
                object[key] !==
                    null &&
                object[key] !==
                    undefined
            ) {

                return object[key];

            }

        }


        return fallback;

    }


    /* =====================================================
       PERMISSIONS
    ====================================================== */

    function hasAgentPermission(permission) {

        if (
            typeof isMaster !== "undefined" &&
            isMaster === true
        ) {
            return true;
        }

        let permissions = [];

        try {

            if (
                typeof myPermissions !== "undefined" &&
                Array.isArray(myPermissions)
            ) {
                permissions = myPermissions;
            }
            else if (
                Array.isArray(window.myPermissions)
            ) {
                permissions = window.myPermissions;
            }

        } catch (error) {

            permissions = [];

        }

        return permissions.some(
            value =>
                String(value) ===
                String(permission)
        );

    }


    function canViewOfficers() {

        return hasAgentPermission(
            "officers.view"
        );

    }


    function canEditOfficers() {

        return hasAgentPermission(
            "officers.edit"
        );

    }


    /* =====================================================
       RANK SORTING
    ====================================================== */

    function getAgentRankId(agent) {

        return String(
            getValue(
                agent,
                [
                    "rankId",
                    "RankId",
                    "RankID"
                ],
                ""
            )
        );

    }


    function getAgentRankName(agent) {

        return String(
            getValue(
                agent,
                [
                    "rankName",
                    "rank",
                    "Rank"
                ],
                "Kein Rang"
            )
        );

    }


    function getRankLevel(rank) {

        if (!rank) {
            return Number.NEGATIVE_INFINITY;
        }

        const raw =
            getValue(
                rank,
                [
                    "level",
                    "Level",
                    "priority",
                    "Priority",
                    "order",
                    "Order"
                ],
                ""
            );

        const level = Number(raw);

        return Number.isFinite(level)
            ? level
            : Number.NEGATIVE_INFINITY;

    }


    function findAgentRankOption(agent) {

        const rankId =
            getAgentRankId(agent);

        if (rankId) {

            const byId =
                state.rankOptions.find(
                    rank =>
                        String(
                            getValue(
                                rank,
                                [
                                    "id",
                                    "ID",
                                    "rankId",
                                    "RankId"
                                ],
                                ""
                            )
                        ) ===
                        rankId
                );

            if (byId) {
                return byId;
            }

        }

        const rankName =
            getAgentRankName(agent)
                .trim()
                .toLowerCase();

        if (!rankName) {
            return null;
        }

        return (
            state.rankOptions.find(
                rank =>
                    String(
                        getValue(
                            rank,
                            [
                                "name",
                                "Name",
                                "rank",
                                "Rank"
                            ],
                            ""
                        )
                    )
                    .trim()
                    .toLowerCase() ===
                    rankName
            ) ||
            null
        );

    }


    function sortAgentsByRank() {

        state.agents.sort(
            (a, b) => {

                const aRank =
                    findAgentRankOption(a);

                const bRank =
                    findAgentRankOption(b);

                const aLevel =
                    getRankLevel(aRank);

                const bLevel =
                    getRankLevel(bRank);

                if (aLevel !== bLevel) {
                    return bLevel - aLevel;
                }

                const rankCompare =
                    getAgentRankName(a)
                        .localeCompare(
                            getAgentRankName(b),
                            "de-DE",
                            {
                                sensitivity: "base"
                            }
                        );

                if (rankCompare !== 0) {
                    return rankCompare;
                }

                return String(
                    getValue(
                        a,
                        [
                            "name",
                            "Name"
                        ],
                        ""
                    )
                ).localeCompare(
                    String(
                        getValue(
                            b,
                            [
                                "name",
                                "Name"
                            ],
                            ""
                        )
                    ),
                    "de-DE",
                    {
                        sensitivity: "base"
                    }
                );

            }
        );

    }


    function loadAgentRankOrdering(
        token,
        callback
    ) {

        if (!Array.isArray(state.agents) || !state.agents.length) {

            state.rankOptions = [];
            sortAgentsByRank();
            callback();
            return;

        }

        const firstAgentId =
            String(
                getValue(
                    state.agents[0],
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );

        if (!firstAgentId) {

            state.rankOptions = [];
            sortAgentsByRank();
            callback();
            return;

        }

        CloudApi.run

            .withSuccessHandler(
                bundle => {

                    state.rankOptions =
                        bundle &&
                        Array.isArray(bundle.rankOptions)
                            ? bundle.rankOptions
                            : [];

                    sortAgentsByRank();
                    callback();

                }
            )

            .withFailureHandler(
                error => {

                    console.warn(
                        "FIB MDT – Beamte: Rangsortierung konnte nicht geladen werden. Die Liste wird mit Fallback-Reihenfolge sortiert.",
                        error
                    );

                    state.rankOptions = [];
                    sortAgentsByRank();
                    callback();

                }
            )

            .getPersonnelFileBundle(
                token,
                firstAgentId
            );

    }


    function formatDate(
        value
    ) {

        if (
            !value
        ) {

            return "—";

        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(
                value
            );

        }


        return date.toLocaleDateString(
            "de-DE"
        );

    }


    function toDateInputValue(
        value
    ) {

        if (!value) {
            return "";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return (
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +
            "-" +
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            )
        );

    }


    /* =====================================================
       INITIALIZATION
    ====================================================== */

    function initializeAgentsPage() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (!canViewOfficers()) {

            renderAgentsError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            updateAgentsCount();
            return;

        }


        bindAgentsSearch();

        bindGlobalEvents();

        loadAgents();

    }


    /*
     * Die Page wird dynamisch in den DOM geladen.
     *
     * Deshalb einmalig leicht verzögert initialisieren.
     *
     * WICHTIG:
     * Dieser Aufruf darf in dieser Datei nur EINMAL
     * vorhanden sein.
     */

    setTimeout(
        function() {

            initializeAgentsPage();

        },
        50
    );


    /* =====================================================
       SEARCH
    ====================================================== */

    function bindAgentsSearch() {

        const input =
            $("agentsSearchInput");


        if (!input) {
            return;
        }


        input.oninput =
            function() {

                filterAgents(
                    this.value
                );

            };

    }


    function filterAgents(
        query
    ) {

        const value =
            String(
                query ||
                ""
            )
            .trim()
            .toLowerCase();


        if (!value) {

            state.filteredAgents =
                [
                    ...state.agents
                ];

        } else {

            state.filteredAgents =
                state.agents.filter(
                    agent => {

                        const haystack = [

                            agent.name,

                            agent.username,

                            agent.rank,

                            agent.serviceNumber,

                            agent.phone,

                            agent.callSign,

                            agent.department,

                            agent.unit

                        ]
                        .map(
                            value =>
                                String(
                                    value ??
                                    ""
                                ).toLowerCase()
                        )
                        .join(" ");


                        return haystack.includes(
                            value
                        );

                    }
                );

        }


        renderAgentsList();

    }


    /* =====================================================
       LOAD AGENTS
    ====================================================== */

    function loadAgents() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (!canViewOfficers()) {

            renderAgentsError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            updateAgentsCount();
            return;

        }


        list.innerHTML = `

            <div class="agents-state">

                <div class="agents-loading">

                    <div class="agents-loading-spinner"></div>

                    Beamte werden geladen...

                </div>

            </div>

        `;


        const token =
            getAgentsSessionToken();


        console.log(
            "FIB MDT – Beamte: Starte Laden",
            {
                hasToken:
                    !!token,

                tokenLength:
                    token
                        ? String(token).length
                        : 0
            }
        );


        if (!token) {

            console.error(
                "FIB MDT – Beamte: Kein Session-Token vorhanden."
            );


            renderAgentsError(
                "Keine aktive Sitzung."
            );

            return;

        }


        CloudApi.run

            .withSuccessHandler(
                response => {

                    console.log(
                        "FIB MDT – Beamte: Serverantwort",
                        response
                    );


                    /*
                     * Erwartet normalerweise:
                     *
                     * [
                     *   {...},
                     *   {...}
                     * ]
                     *
                     * Akzeptiert zusätzlich:
                     *
                     * {
                     *   agents: [...]
                     * }
                     *
                     * Eine ungültige Antwort wird NICHT
                     * mehr still zu [] umgewandelt.
                     */

                    let agents =
                        null;


                    if (
                        Array.isArray(
                            response
                        )
                    ) {

                        agents =
                            response;

                    }
                    else if (
                        response &&
                        Array.isArray(
                            response.agents
                        )
                    ) {

                        agents =
                            response.agents;

                    }


                    if (
                        !Array.isArray(
                            agents
                        )
                    ) {

                        console.error(
                            "FIB MDT – Beamte: Ungültige Serverantwort.",
                            response
                        );


                        renderAgentsError(
                            "Der Server hat keine gültige Beamtenliste zurückgegeben."
                        );

                        return;

                    }


                    state.agents =
                        [
                            ...agents
                        ];


                    loadAgentRankOrdering(
                        token,
                        function() {

                            state.filteredAgents =
                                [
                                    ...state.agents
                                ];


                            console.log(
                                "FIB MDT – Beamte: Beamte geladen und nach Rang sortiert",
                                state.agents.length
                            );


                            updateAgentsCount();

                            renderAgentsList();

                        }
                    );

                }
            )

            .withFailureHandler(
                error => {

                    console.error(
                        "FIB MDT – Beamte RPC-Fehler:",
                        error
                    );


                    renderAgentsError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Beamten konnten nicht geladen werden."
                    );

                }
            )

            .getPersonnelList(
                token
            );

    }


    function updateAgentsCount() {

        const element =
            $("agentsPageCount");


        if (!element) {
            return;
        }


        const count =
            state.agents.length;


        element.textContent =
            count === 1
                ? "1 Beamter"
                : `${count} Beamte`;

    }


    /* =====================================================
       LIST RENDER
    ====================================================== */

    function renderAgentsList() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (
            !state.filteredAgents.length
        ) {

            list.innerHTML = `

                <div class="agents-state">

                    Keine Beamten gefunden.

                </div>

            `;

            return;

        }


        list.innerHTML =
            state.filteredAgents
                .map(
                    createAgentRow
                )
                .join("");


        list
            .querySelectorAll(
                "[data-agent-id]"
            )
            .forEach(
                row => {

                    row.addEventListener(
                        "click",
                        function(event) {

                            if (
                                event.target.closest(
                                    ".agents-file-button"
                                )
                            ) {

                                return;

                            }


                            openPersonnelFile(
                                row.dataset.agentId
                            );

                        }
                    );

                }
            );


        list
            .querySelectorAll(
                ".agents-file-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();


                            openPersonnelFile(
                                button.dataset.agentId
                            );

                        }
                    );

                }
            );

    }


    function createAgentRow(
        agent
    ) {

        const id =
            String(
                getValue(
                    agent,
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );


        const name =
            String(
                getValue(
                    agent,
                    [
                        "name",
                        "Name"
                    ],
                    "Unbekannter Beamter"
                )
            );


        const username =
            String(
                getValue(
                    agent,
                    [
                        "username",
                        "Username"
                    ],
                    ""
                )
            );


        const rank =
            String(
                getValue(
                    agent,
                    [
                        "rankName",
                        "rank",
                        "Rank"
                    ],
                    "Kein Rang"
                )
            );


        const serviceNumber =
            String(
                getValue(
                    agent,
                    [
                        "serviceNumber",
                        "ServiceNumber"
                    ],
                    "—"
                )
            );


        const department =
            String(
                getValue(
                    agent,
                    [
                        "department",
                        "Department"
                    ],
                    "—"
                )
            );


        const unit =
            String(
                getValue(
                    agent,
                    [
                        "unit",
                        "Unit"
                    ],
                    ""
                )
            );


        const callSign =
            String(
                getValue(
                    agent,
                    [
                        "callSign",
                        "CallSign"
                    ],
                    ""
                )
            );


        const profileImage =
            String(
                getValue(
                    agent,
                    [
                        "profileImage",
                        "ProfileImage"
                    ],
                    ""
                )
            );


        const initial =
            escapeHtml(
                name
                    .trim()
                    .charAt(0)
                    .toUpperCase() ||
                "?"
            );


        const avatar =
            profileImage

                ? `

                    <img
                        class="agents-avatar"
                        src="${escapeHtml(profileImage)}"
                        alt=""
                    >

                  `

                : `

                    <div
                        class="
                            agents-avatar
                            agents-avatar-placeholder
                        "
                    >
                        ${initial}
                    </div>

                  `;


        const meta =
            [];


        if (unit) {

            meta.push(
                escapeHtml(
                    unit
                )
            );

        }


        if (callSign) {

            meta.push(
                escapeHtml(
                    callSign
                )
            );

        }


        return `

            <div
                class="agents-list-row"
                data-agent-id="${escapeHtml(id)}"
            >

                <div class="agents-agent-cell">

                    ${avatar}

                    <div class="agents-agent-main">

                        <div class="agents-agent-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="agents-agent-meta">

                            <span class="agents-agent-rank">
                                ${escapeHtml(rank)}
                            </span>

                            ${
                                username
                                    ? `
                                        <span class="agents-agent-username">
                                            @${escapeHtml(username)}
                                        </span>
                                      `
                                    : ""
                            }

                        </div>

                    </div>

                </div>


                <div class="agents-service-number">
                    ${escapeHtml(serviceNumber)}
                </div>


                <div class="agents-organization">

                    <div class="agents-organization-main">
                        ${escapeHtml(
                            department ||
                            "—"
                        )}
                    </div>

                    ${
                        meta.length
                            ? `
                                <div class="agents-organization-meta">

                                    ${meta
                                        .map(
                                            item =>
                                                `<span>${item}</span>`
                                        )
                                        .join("")}

                                </div>
                              `
                            : ""
                    }

                </div>


                <div class="agents-file-button-wrap">

                    <button
                        type="button"
                        class="agents-file-button"
                        data-agent-id="${escapeHtml(id)}"
                    >
                        Öffnen
                    </button>

                </div>

            </div>

        `;

    }


    function renderAgentsError(
        message
    ) {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        list.innerHTML = `

            <div class="agents-state">

                ${escapeHtml(
                    message
                )}

            </div>

        `;

    }


    /* =====================================================
       OPEN PERSONNEL FILE
    ====================================================== */

    function openPersonnelFile(
        userId
    ) {

        if (!canViewOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            return;

        }

        const agent =
            state.agents.find(
                item =>
                    String(
                        getValue(
                            item,
                            [
                                "id",
                                "ID"
                            ],
                            ""
                        )
                    ) ===
                    String(
                        userId
                    )
            );


        if (!agent) {

            showAgentError(
                "Der ausgewählte Beamte konnte nicht gefunden werden."
            );

            return;

        }


        state.selectedAgent =
            {
                ...agent
            };


        state.modalTab =
            "personal";


        state.bundleLoaded =
            false;


        state.bundleLoading =
            true;


        state.trainings =
            [];


        state.notes =
            [];


        state.trainingsLoaded =
            false;


        state.notesLoaded =
            false;


        renderPersonnelModal(
            false
        );


        openAgentsModal();


        const token =
            getAgentsSessionToken();


        if (!token) {

            state.bundleLoading =
                false;

            showAgentError(
                "Keine aktive Sitzung."
            );

            return;

        }


        /*
         * Genau EIN Request.
         */

        CloudApi.run

            .withSuccessHandler(
                bundle => {

                    if (
                        !state.selectedAgent ||
                        String(
                            state.selectedAgent.id
                        ) !==
                        String(
                            userId
                        )
                    ) {

                        return;

                    }


                    bundle =
                        bundle &&
                        typeof bundle ===
                            "object"
                            ? bundle
                            : {};


                    state.selectedAgent = {

                        ...state.selectedAgent,

                        ...(
                            bundle.agent &&
                            typeof bundle.agent ===
                                "object"
                                ? bundle.agent
                                : {}
                        )

                    };


                    /*
                     * Vorhandenes Profilbild aus
                     * der Beamtenliste behalten.
                     */

                    if (
                        !state.selectedAgent.profileImage &&
                        agent.profileImage
                    ) {

                        state.selectedAgent.profileImage =
                            agent.profileImage;

                    }


                    state.rankOptions =
                        Array.isArray(
                            bundle.rankOptions
                        )
                            ? bundle.rankOptions
                            : [];


                    state.trainings =
                        Array.isArray(
                            bundle.trainings
                        )
                            ? bundle.trainings
                            : [];


                    state.notes =
                        Array.isArray(
                            bundle.notes
                        )
                            ? bundle.notes
                            : [];


                    state.trainingsLoaded =
                        true;


                    state.notesLoaded =
                        true;


                    state.bundleLoaded =
                        true;


                    state.bundleLoading =
                        false;


                    renderPersonnelModal(
                        true
                    );

                }
            )

            .withFailureHandler(
                error => {

                    state.bundleLoading =
                        false;


                    console.error(
                        "FIB MDT – Personalakten-Bundle:",
                        error
                    );


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Personalakte konnte nicht geladen werden."
                    );


                    renderPersonnelModal(
                        true
                    );

                }
            )

            .getPersonnelFileBundle(
                token,
                userId
            );

    }

    function openAgentsModal() {
        const modalElement = $("agentsSystemModal");
        const manager = window.FIB_MDT_MODAL;
        if (!modalElement || !manager || typeof manager.open !== "function") return;
        manager.open({
            title: "Personalakte",
            subtitle: "Personalverwaltung",
            body: modalElement,
            modalClass: "agents",
            cancelVisible: false,
            saveVisible: false,
            focus: false,
            onClose: function () {
                const host = $("agentsSystemModalOverlay");
                if (host && modalElement && modalElement.parentElement !== host) host.appendChild(modalElement);
                document.body.style.overflow = "";
                closeRankDropdown();
                state.selectedAgent = null;
                state.bundleLoading = false;
            }
        });
        document.body.style.overflow = "hidden";
    }

    function closePersonnelFile() {
        const overlay = $("agentsSystemModalOverlay");
        const modalElement = $("agentsSystemModal");
        const manager = window.FIB_MDT_MODAL;
        // Return the live node to its page-owned host so all existing IDs,
        // event listeners and personnel-file state survive opening/closing.
        if (overlay && modalElement && modalElement.parentElement !== overlay) {
            overlay.appendChild(modalElement);
        }
        if (manager && typeof manager.close === "function") manager.close();
        if (overlay) overlay.classList.remove("active");
        document.body.style.overflow = "";
        closeRankDropdown();
        state.selectedAgent = null;
        state.bundleLoading = false;
    }

    function getCurrentRankLabel(
        rankId,
        fallback
    ) {

        const found =
            state.rankOptions.find(
                rank =>
                    String(
                        getValue(
                            rank,
                            [
                                "id",
                                "ID"
                            ],
                            ""
                        )
                    ) ===
                    String(
                        rankId
                    )
            );


        return found
            ? String(
                getValue(
                    found,
                    [
                        "name",
                        "Name"
                    ],
                    fallback
                )
              )
            : (
                fallback ||
                "Kein Rang"
              );

    }


    function bindRankDropdown() {

        if (!canEditOfficers()) {
            return;
        }

        const wrapper =
            $("agentRankSelect");


        const button =
            $("agentRankSelectButton");


        if (!wrapper || !button) {
            return;
        }


        button.onclick =
            function(event) {

                event.stopPropagation();


                const isOpen =
                    wrapper.classList.contains(
                        "open"
                    );


                closeRankDropdown();


                if (!isOpen) {

                    wrapper.classList.add(
                        "open"
                    );


                    renderRankOptions();

                }

            };


        renderRankOptions();

    }


    function renderRankOptions() {

        const menu =
            $("agentRankSelectMenu");


        const native =
            $("agentRankNativeSelect");


        const label =
            $("agentRankSelectLabel");


        if (
            !menu ||
            !native ||
            !label
        ) {
            return;
        }


        menu.innerHTML =
            "";


        native.innerHTML =
            "";


        if (
            !state.rankOptions.length
        ) {

            menu.innerHTML = `

                <div class="agents-rank-empty">

                    Keine Ränge verfügbar

                </div>

            `;

            return;

        }


        const currentRankId =
            String(
                getValue(
                    state.selectedAgent,
                    [
                        "rankId",
                        "RankId"
                    ],
                    ""
                )
            );


        const sortedRankOptions =
            [
                ...state.rankOptions
            ].sort(
                (a, b) => {

                    const levelCompare =
                        getRankLevel(b) -
                        getRankLevel(a);

                    if (levelCompare !== 0) {
                        return levelCompare;
                    }

                    return String(
                        getValue(
                            a,
                            [
                                "name",
                                "Name"
                            ],
                            ""
                        )
                    ).localeCompare(
                        String(
                            getValue(
                                b,
                                [
                                    "name",
                                    "Name"
                                ],
                                ""
                            )
                        ),
                        "de-DE",
                        { sensitivity: "base" }
                    );

                }
            );


        sortedRankOptions.forEach(
            rank => {

                const id =
                    String(
                        getValue(
                            rank,
                            [
                                "id",
                                "ID"
                            ],
                            ""
                        )
                    );


                const name =
                    String(
                        getValue(
                            rank,
                            [
                                "name",
                                "Name"
                            ],
                            id
                        )
                    );


                const nativeOption =
                    document.createElement(
                        "option"
                    );


                nativeOption.value =
                    id;


                nativeOption.textContent =
                    name;


                if (
                    id ===
                    currentRankId
                ) {

                    nativeOption.selected =
                        true;


                    label.textContent =
                        name;

                }


                native.appendChild(
                    nativeOption
                );


                const item =
                    document.createElement(
                        "button"
                    );


                item.type =
                    "button";


                item.className =
                    "agents-rank-option";


                item.dataset.rankId =
                    id;


                item.textContent =
                    name;


                if (
                    id ===
                    currentRankId
                ) {

                    item.classList.add(
                        "selected"
                    );

                }


                item.onclick =
                    function(event) {

                        event.stopPropagation();


                        selectPersonnelRank(
                            id,
                            name
                        );

                    };


                menu.appendChild(
                    item
                );

            }
        );


        if (
            !currentRankId
        ) {

            label.textContent =
                "Rang auswählen...";

        }

    }


    function selectPersonnelRank(
        rankId,
        rankName
    ) {

        if (!canEditOfficers()) {
            return;
        }

        const native =
            $("agentRankNativeSelect");


        const label =
            $("agentRankSelectLabel");


        const wrapper =
            $("agentRankSelect");


        if (
            !native ||
            !label
        ) {
            return;
        }


        native.value =
            String(
                rankId
            );


        label.textContent =
            rankName;


        document
            .querySelectorAll(
                ".agents-rank-option"
            )
            .forEach(
                option => {

                    option.classList.toggle(
                        "selected",
                        String(
                            option.dataset.rankId
                        ) ===
                        String(
                            rankId
                        )
                    );

                }
            );


        state.selectedAgent.rankId =
            String(
                rankId
            );


        state.selectedAgent.rankName =
            rankName;


        state.selectedAgent.rank =
            rankName;


        if (wrapper) {

            wrapper.classList.remove(
                "open"
            );

        }

    }


    function closeRankDropdown() {

        const wrapper =
            $("agentRankSelect");


        if (wrapper) {

            wrapper.classList.remove(
                "open"
            );

        }

    }

    function savePersonnelProfile() {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        const userId =
            String(
                getValue(
                    agent,
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );


        if (!token) {

            showAgentError(
                "Keine aktive Sitzung."
            );

            return;

        }


        const data = {

            serviceNumber:
                $("agentServiceNumber")
                    ?.value
                    ?.trim() ||
                "",

            phone:
                $("agentPhone")
                    ?.value
                    ?.trim() ||
                "",

            callSign:
                $("agentCallSign")
                    ?.value
                    ?.trim() ||
                "",

            department:
                $("agentDepartment")
                    ?.value
                    ?.trim() ||
                "",

            unit:
                $("agentUnit")
                    ?.value
                    ?.trim() ||
                "",

            email:
                $("agentEmail")
                    ?.value
                    ?.trim() ||
                "",

            address:
                $("agentAddress")
                    ?.value
                    ?.trim() ||
                "",

            entryDate:
                $("agentEntryDate")
                    ?.value ||
                "",

            personnelStatus:
                $("agentPersonnelStatus")
                    ?.value
                    ?.trim() ||
                "",

            note:
                $("agentPersonnelNote")
                    ?.value
                    ?.trim() ||
                "",

            rankId:
                $("agentRankNativeSelect")
                    ?.value ||
                getValue(
                    agent,
                    [
                        "rankId",
                        "RankId"
                    ],
                    ""
                )

        };


        const button =
            $("agentSavePersonalButton");


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "Wird gespeichert...";

        }


        CloudApi.run

            .withSuccessHandler(
                () => {

                    state.selectedAgent = {

                        ...state.selectedAgent,

                        ...data

                    };


                    const selectedRank =
                        state.rankOptions.find(
                            rank =>
                                String(
                                    getValue(
                                        rank,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) ===
                                String(
                                    data.rankId
                                )
                        );


                    if (
                        selectedRank
                    ) {

                        state.selectedAgent.rankId =
                            data.rankId;


                        state.selectedAgent.rankName =
                            getValue(
                                selectedRank,
                                [
                                    "name",
                                    "Name"
                                ],
                                "Kein Rang"
                            );


                        state.selectedAgent.rank =
                            state.selectedAgent.rankName;

                    }


                    const index =
                        state.agents.findIndex(
                            item =>
                                String(
                                    getValue(
                                        item,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) ===
                                userId
                        );


                    if (
                        index !==
                        -1
                    ) {

                        state.agents[index] = {

                            ...state.agents[index],

                            ...state.selectedAgent

                        };

                    }


                    filterAgents(
                        $("agentsSearchInput")
                            ?.value ||
                        ""
                    );


                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Personalakte speichern";

                    }


                    showAgentSuccess(
                        "Die Personalakte wurde erfolgreich gespeichert."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Personalakte speichern";

                    }


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Personalakte konnte nicht gespeichert werden."
                    );

                }
            )

            .savePersonnelProfile(
                token,
                userId,
                data
            );

    }

                $("trainingExpiryDate")
                    ?.value ||
                "",

            notes:
                $("trainingNotes")
                    ?.value
                    ?.trim() ||
                ""

        CloudApi.run

            .withSuccessHandler(
                created => {

                    state.trainings =
                        [
                            created,
                            ...state.trainings
                        ];


                    state.trainingsLoaded =
                        true;


                    renderPersonnelModal(
                        true

                    showAgentSuccess(

                        "Die Schulung konnte nicht eingetragen werden."

    /* =====================================================

    ====================================================== */

    function bindGlobalEvents() {

        if (
            state.globalEventsBound
        ) {
            return;
        }


        state.globalEventsBound =
            true;


        document.addEventListener(
            "click",
            function(event) {

                const rankSelect =
                    $("agentRankSelect");


                if (
                    rankSelect &&
                    !rankSelect.contains(
                        event.target
                    )
                ) {

                    closeRankDropdown();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key !==
                    "Escape"
                ) {

                    return;

                }


                const overlay =
                    $("agentsSystemModalOverlay");


                if (
                    overlay &&
                    overlay.classList.contains(
                        "active"
                    )
                ) {

                    closePersonnelFile();

                }

            }
        );


        document.addEventListener(
            "click",
            function(event) {

                const overlay =
                    $("agentsSystemModalOverlay");


                if (
                    overlay &&
                    event.target ===
                    overlay
                ) {

                    closePersonnelFile();

                }

            }
        );

    }


    /* =====================================================
       NOTIFICATIONS
    ====================================================== */

    function showAgentError(
        message
    ) {

        if (
            typeof window.showSystemError ===
            "function"
        ) {

            window.showSystemError(
                message
            );

            return;

        }


        console.error(
            "FIB MDT – Fehler:",
            message
        );

    }


    function showAgentSuccess(
        message
    ) {

        if (
            typeof window.showSystemSuccess ===
            "function"
        ) {

            window.showSystemSuccess(
                message
            );

            return;

        }


        console.log(
            "FIB MDT – Erfolg:",
            message
        );

    }


    /* =====================================================
       GLOBAL FUNCTIONS
    ====================================================== */

    window.openPersonnelFile =
        openPersonnelFile;


    window.closePersonnelFile =
        closePersonnelFile;


})();
